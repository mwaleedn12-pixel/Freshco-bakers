# Freshco Bakers — Docker Compose (production stack)
# Usage:
#   docker compose up -d                     # start everything
#   docker compose exec backend alembic upgrade head   # run migrations
#   docker compose logs -f backend           # tail backend logs

services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshco_bakers_db
      POSTGRES_USER: freshco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshco_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshco_user -d freshco_bakers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (optional — caching & rate-limit store) ────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://freshco_user:${POSTGRES_PASSWORD:-freshco_pass}@postgres:5432/freshco_bakers_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://freshcobakers.com","https://www.freshcobakers.com"]'
      ALLOWED_HOSTS: '["freshcobakers.com","www.freshcobakers.com","api.freshcobakers.com"]'
      RATE_LIMIT_PER_MINUTE: "120"
      LOG_LEVEL: INFO
      N8N_ENABLED: "true"
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/freshco-events
      N8N_WEBHOOK_SECRET: ${N8N_WEBHOOK_SECRET:-freshco-n8n-secret-key-2026}
    ports:
      - "8000:8000"

  # ─── n8n Automation Engine ────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=0.0.0.0
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Asia/Karachi
      - TZ=Asia/Karachi
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - n8n
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  n8n_data:

