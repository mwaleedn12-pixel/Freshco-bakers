# Freshco Bakers — Docker Compose (production stack)
# Usage:
#   docker compose up -d                     # start everything
#   docker compose exec backend alembic upgrade head   # run migrations
#   docker compose logs -f backend           # tail backend logs

services:
  # ─── PostgreSQL ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: freshco_bakers_db
      POSTGRES_USER: freshco_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freshco_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freshco_user -d freshco_bakers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (optional — caching & rate-limit store) ────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── FastAPI Backend ──────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      DATABASE_URL: postgresql+psycopg://freshco_user:${POSTGRES_PASSWORD:-freshco_pass}@postgres:5432/freshco_bakers_db
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["https://freshcobakers.com","https://www.freshcobakers.com"]'
      ALLOWED_HOSTS: '["freshcobakers.com","www.freshcobakers.com","api.freshcobakers.com"]'
      RATE_LIMIT_PER_MINUTE: "120"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"

  # ─── Nginx Reverse Proxy ─────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/web:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
